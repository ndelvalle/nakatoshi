[package]
name = "nakatoshi"
version = "0.3.0"
authors = ["ndelvalle <nicolas.delvalle@gmail.com>"]
edition = "2024"
rust-version = "1.88"
description = "Bitcoin vanity address generator"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ndelvalle/nakatoshi"
repository = "https://github.com/ndelvalle/nakatoshi"
keywords = ["bitcoin", "address", "vanity", "vanity-address"]
categories = ["command-line-utilities"]

[dependencies]
bitcoin = "0.32.102"
clap = "4.6.8"
rayon = "1.12.0"
getrandom = "0.4.3"
# The private key comes first in the output, so a result that is cut off never
# has an address without its key.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
num_cpus = "1.17.0"
indicatif = "0.18.6"
k256 = { version = "0.14.0", default-features = false, features = ["arithmetic"] }

[profile.release]
lto = true
codegen-units = 1
